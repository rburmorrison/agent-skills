# Merge into a package manifest; use workspace.lints.clippy for shared settings.
[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
# Suppressions must be #[expect(..., reason = "...")], never #[allow].
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
