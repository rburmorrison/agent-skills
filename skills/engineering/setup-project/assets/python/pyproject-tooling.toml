# Merge these tables into the package-manager-created pyproject.toml.
[tool.ruff.lint]
# Baseline for every project; add project-specific families during planning.
select = [
    "E", "W", "F",         # Syntax, style, imports, and undefined/unused names.
    "I", "UP", "TC",       # Import order, modern syntax, and typing-only imports.
    "N",                   # Naming conventions.
    "B", "A", "C4",        # Common bugs, shadowing, and comprehension clarity.
    "SIM", "RET", "RUF",   # Simplification and consistent control flow.
    "PL", "C901",          # Pylint checks and overly complex functions.
    "ARG", "ERA", "T20",   # Unused arguments, commented-out code, stray prints.
    "TRY", "BLE",          # Exception handling and broad exceptions.
    "PTH", "DTZ", "PERF",  # Pathlib, timezone-aware datetimes, performance.
    "S",                   # Common security mistakes.
    "PT",                  # Pytest style.
    "PGH",                 # Explicit suppression codes and type-check hygiene.
]
ignore = [
    "E501", # The formatter owns line length; it cannot wrap long strings.
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# Assertions are the test framework's observable behavior checks, and tests
# compare against literal expected values.
"**/test_*.py" = ["S101", "PLR2004"]
"**/*_test.py" = ["S101", "PLR2004"]
"**/conftest.py" = ["S101", "PLR2004"]

[tool.basedpyright]
pythonVersion = "3.11" # Set to the project's minimum supported Python version.
typeCheckingMode = "strict"
failOnWarnings = true
reportAny = "error"
reportExplicitAny = "error"
reportIgnoreCommentWithoutRule = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportInvalidCast = "error"
reportUnannotatedClassAttribute = "error"
reportUnusedCallResult = "error"
reportUnreachable = "error"
reportImplicitStringConcatenation = "error"
